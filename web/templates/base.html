<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ BRAND }}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: {
        ink: '#f5f5f7', mut: '#9b9ba3', accent: '#7c86ff',
        good: '#34d399', bad: '#f87171', warn: '#fbbf24',
      }}}}
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="min-h-screen text-ink antialiased">

<header class="chrome fixed inset-x-0 top-0 z-40">
  <div class="mx-auto flex h-14 max-w-5xl items-center gap-6 px-5">
    <a href="{{ url_for('index') }}" class="flex items-center gap-2.5 press">
      <span class="brandmark" aria-hidden="true"></span>
      <span class="text-[15px] font-semibold tracking-tight">{{ BRAND }}</span>
    </a>
    {% if user %}
      <nav class="flex items-center gap-1 text-[13px] text-mut">
        <a href="{{ url_for('servers') }}" class="navlink press">Servers</a>
        <a href="{{ url_for('account') }}" class="navlink press">Account</a>
      </nav>
      <div class="ml-auto flex items-center gap-3">
        <span class="flex items-center gap-2 text-[13px] text-mut">
          {% if user.avatar %}
            <img src="https://cdn.discordapp.com/avatars/{{ user.id }}/{{ user.avatar }}.png?size=64"
                 alt="" class="h-6 w-6 rounded-full">
          {% endif %}
          {{ user.name }}
        </span>
        <form method="post" action="{{ url_for('logout') }}">
          <input type="hidden" name="_csrf" value="{{ csrf_token }}">
          <button class="navlink press text-[13px] text-mut">Sign out</button>
        </form>
      </div>
    {% endif %}
  </div>
</header>

<main class="mx-auto max-w-5xl px-5 pb-24 pt-24">
  {% block content %}{% endblock %}
</main>

</body>
</html>
